<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Investment Collective at Carolina (ICC). Coming soon.">
<title>Investment Collective at Carolina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: single centered column on white; the ICC mark carries the page, one inquiry line below */
:root {
  --bg: #FFFFFF;
  --navy: #13294B;
  --carolina: #4B9CD3;
  --muted: #55627A;
  --line: #DDE3EC;
  --display: "Libre Baskerville", Georgia, "Times New Roman", serif;
  --body: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--navy); font-family: var(--body); font-size: 17px; line-height: 1.6; }
.page { min-height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 22px; padding-block: 72px 48px; }
.mark { font-family: var(--display); font-weight: 700; font-size: clamp(80px, 16vw, 140px); line-height: 1; letter-spacing: 0.04em; }
.bar { width: 140px; height: 5px; background: var(--carolina); }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3.4vw, 30px); line-height: 1.25; margin: 0; }
.soon { font-family: var(--mono); font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 0; }
.inquiry { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 18px; padding-top: 28px; border-top: 1px solid var(--line); width: min(420px, 100%); }
.inquiry p { margin: 0; color: var(--muted); }
.contact { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
.email { font-family: var(--mono); font-size: 16px; border: 1px solid var(--line); padding: 11px 14px; user-select: all; }
.copy { font: inherit; font-weight: 600; background: var(--navy); color: #FFFFFF; border: 0; padding: 12px 18px; cursor: pointer; }
.copy:hover { background: #1E3A66; }
.copy:focus-visible { outline: 3px solid var(--carolina); outline-offset: 3px; }
footer { padding-block: 24px 32px; text-align: center; font-size: 13px; color: var(--muted); }
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>
</head>
<body>


<div class="page">
  <main>
    <div class="mark" aria-label="ICC">ICC</div>
    <div class="bar" aria-hidden="true"></div>
    <h1>Investment Collective at Carolina</h1>
    <p class="soon">Coming soon</p>
    <div class="inquiry">
      <p>For inquiries, contact us at</p>
      <div class="contact">
        <span class="email" id="email">noahross@unc.edu</span>
        <button class="copy" id="copyBtn" type="button">Copy email</button>
      </div>
    </div>
  </main>
  <footer>Investment Collective at Carolina (ICC). A student organization pending registration at UNC-Chapel Hill; not affiliated with or endorsed by the University.</footer>
</div>

<script>
document.getElementById('copyBtn').addEventListener('click', function () {
  var btn = this, text = document.getElementById('email').textContent;
  var done = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy email'; }, 1800); };
  var fallback = function () {
    var r = document.createRange(); r.selectNodeContents(document.getElementById('email'));
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    btn.textContent = 'Press Cmd+C';
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
});
</script>

</body>
</html>
